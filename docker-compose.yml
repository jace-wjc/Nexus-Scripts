services:
  # Nginx 反向代理
  nginx:
    image: hub.rat.dev/library/nginx:1.25.2-alpine
    container_name: nginx_proxy
    ports:
      - "0.0.0.0:8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - fastapi
    environment:
      - TZ=Asia/Shanghai
    networks:
      - app-network

  # 前端React服务
  frontend:
    build:
      context: .
      dockerfile: ./my-app/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        APP_VERSION: ${APP_VERSION:-}
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: project-root-frontend:v1.0.0
    restart: always
    volumes:
      - resource_logos:/app/runtime-logos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - NEXT_PUBLIC_API_BASE_URL=/api
      - BACKEND_INTERNAL_BASE_URL=http://fastapi:8091
      - RESOURCE_LOGO_ROOT=/app/runtime-logos
      - SCRIPT_HUB_SESSION_SECRET=${SCRIPT_HUB_SESSION_SECRET}
      - SCRIPT_HUB_ACCESS_KEYS_JSON=${SCRIPT_HUB_ACCESS_KEYS_JSON}
      - AI_API_KEY=${AI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY:-}
      - GEMINI_API_BASE=${GEMINI_API_BASE}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS}
      - GEMINI_PROXY_URL=${GEMINI_PROXY_URL}
      - BUILD_VERSION=${BUILD_VERSION:-dev}
    networks:
      - app-network

  # 后端FastAPI服务
  fastapi:
    container_name: fastapi
    build:
      context: ./fastApiProject
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
    image: project-root-fastapi:v1.0.0
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./fastApiProject:/app               # 映射代码目录，实现实时同步
      - paddlex_models:/root/.paddlex       # PaddleX 模型缓存
      - paddle_models:/root/.paddleocr      # PaddleOCR 模型缓存
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - DB_TEST_HOST=${DB_TEST_HOST}
      - DB_TEST_PORT=${DB_TEST_PORT}
      - DB_TEST_USER=${DB_TEST_USER}
      - DB_TEST_PASSWORD=${DB_TEST_PASSWORD}
      - DB_TEST_DATABASE=${DB_TEST_DATABASE}
      - DB_PROD_HOST=${DB_PROD_HOST}
      - DB_PROD_PORT=${DB_PROD_PORT}
      - DB_PROD_USER=${DB_PROD_USER}
      - DB_PROD_PASSWORD=${DB_PROD_PASSWORD}
      - DB_PROD_DATABASE=${DB_PROD_DATABASE}
      - DB_LOCAL_HOST=${DB_LOCAL_HOST}
      - DB_LOCAL_HOST_DOCKER=${DB_LOCAL_HOST_DOCKER:-host.docker.internal}
      - DB_LOCAL_PORT=${DB_LOCAL_PORT}
      - DB_LOCAL_USER=${DB_LOCAL_USER}
      - DB_LOCAL_PASSWORD=${DB_LOCAL_PASSWORD}
      - DB_LOCAL_DATABASE=${DB_LOCAL_DATABASE}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-600}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-600}
      - SCREENING_WORKER_MAX_CONCURRENCY=${SCREENING_WORKER_MAX_CONCURRENCY:-0}
      - SCREENING_DB_CONNECTION_RESERVE=${SCREENING_DB_CONNECTION_RESERVE:-4}
      - SCREENING_PROVIDER_MAX_CONCURRENCY=${SCREENING_PROVIDER_MAX_CONCURRENCY:-4}
      - SCREENING_PROVIDER_QPS=${SCREENING_PROVIDER_QPS:-4}
      - TEST_HOST_DOMAIN=${TEST_HOST_DOMAIN:-seedlingintl.com}
      - TEST_HOST_PORT=${TEST_HOST_PORT:-8088}
      - TEST_HOST_PROTOCOL=${TEST_HOST_PROTOCOL:-http}
      - TEST_HOST_PREFIX=${TEST_HOST_PREFIX:-fwos}
      - PROD_HOST_DOMAIN=${PROD_HOST_DOMAIN:-seedlingintl.com}
      - PROD_HOST_PORT=${PROD_HOST_PORT:-443}
      - PROD_HOST_PROTOCOL=${PROD_HOST_PROTOCOL:-https}
      - BASE_URL_TEST=${BASE_URL_TEST}
      - BASE_URL_TEST_APP=${BASE_URL_TEST_APP}
      - BASE_URL_PROD=${BASE_URL_PROD}
      - BASE_URL_LOCAL=${BASE_URL_LOCAL}
      - SMS_API_BASE_TEST=${SMS_API_BASE_TEST}
      - SMS_API_BASE_PROD=${SMS_API_BASE_PROD}
      - SMS_AUTH_TOKEN_TEST=${SMS_AUTH_TOKEN_TEST}
      - SMS_AUTH_TOKEN_PROD=${SMS_AUTH_TOKEN_PROD}
      - SMS_ORIGIN_TEST=${SMS_ORIGIN_TEST}
      - SMS_ORIGIN_PROD=${SMS_ORIGIN_PROD}
      - SMS_REFERER_TEST=${SMS_REFERER_TEST}
      - SMS_REFERER_PROD=${SMS_REFERER_PROD}
      - PRESET_MOBILES=${PRESET_MOBILES}
      # SMS Admin Login Config
      - SMS_ADMIN_API_URL_TEST=${SMS_ADMIN_API_URL_TEST}
      - SMS_ADMIN_API_URL_PROD=${SMS_ADMIN_API_URL_PROD}
      - SMS_ADMIN_TENANT_ID_TEST=${SMS_ADMIN_TENANT_ID_TEST}
      - SMS_ADMIN_TENANT_ID_PROD=${SMS_ADMIN_TENANT_ID_PROD}
      - SMS_ADMIN_TENANT_NAME_TEST=${SMS_ADMIN_TENANT_NAME_TEST}
      - SMS_ADMIN_TENANT_NAME_PROD=${SMS_ADMIN_TENANT_NAME_PROD}
      - SMS_ADMIN_USERNAME_TEST=${SMS_ADMIN_USERNAME_TEST}
      - SMS_ADMIN_USERNAME_PROD=${SMS_ADMIN_USERNAME_PROD}
      - SMS_ADMIN_PASSWORD_TEST=${SMS_ADMIN_PASSWORD_TEST}
      - SMS_ADMIN_PASSWORD_PROD=${SMS_ADMIN_PASSWORD_PROD}
      - SMS_ADMIN_CAPTCHA_CODE=${SMS_ADMIN_CAPTCHA_CODE}
      - SMS_ADMIN_CAPTCHA_ID=${SMS_ADMIN_CAPTCHA_ID}
      # AI Config
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL_NAME=${AI_MODEL_NAME}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - SCRIPT_HUB_SESSION_SECRET=${SCRIPT_HUB_SESSION_SECRET}
      - TEAM_RESOURCES_PASSWORD_ENCRYPTION_KEY=${TEAM_RESOURCES_PASSWORD_ENCRYPTION_KEY}
      - TEAM_RESOURCES_EXPORT_ENCRYPTION_KEY=${TEAM_RESOURCES_EXPORT_ENCRYPTION_KEY}
      - TEAM_RESOURCES_BACKUP_DIR=/app/data/team-resource-backups
      - DELIVERY_OSS_HOST_PROD=${DELIVERY_OSS_HOST_PROD}
      - DELIVERY_OSS_HOST_TEST=${DELIVERY_OSS_HOST_TEST}
      - DELIVERY_OSS_ACCESS_KEY_ID=${DELIVERY_OSS_ACCESS_KEY_ID}
      - DELIVERY_OSS_POLICY=${DELIVERY_OSS_POLICY}
      - DELIVERY_OSS_SIGNATURE=${DELIVERY_OSS_SIGNATURE}
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://192.168.1.0/24,http://192.168.20.0/24,http://mac-mini.tail150593.ts.net
      - BUILD_VERSION=${BUILD_VERSION:-dev}
      - TZ=Asia/Shanghai
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  resource_logos:   # UID 1001 runtime images; never remove during rollback
  paddlex_models:    # 持久化 PaddleX 模型缓存
  paddle_models:     # 持久化 PaddleOCR 模型缓存
